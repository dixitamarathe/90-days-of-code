<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 23 - Random Quote Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h2 {
            color: #38bdf8;
            margin-top: 0;
        }
        .quote-box {
            font-size: 16px;
            font-style: italic;
            color: #cbd5e1;
            margin: 20px 0;
            min-height: 60px;
        }
        button {
            padding: 10px 18px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Day 23: Random Quote</h2>
        <div class="quote-box" id="quoteDisplay">Click the button to generate a quote!</div>
        <button id="generateBtn">New Quote</button>
    </div>

    <script>
        const quotes = [
            "Logic first, code second.",
            "Consistency is the key to mastering code.",
            "Small daily progress adds up to big results.",
            "Debug your mindset before debugging your code.",
            "Keep it simple, make it functional."
        ];

        const quoteDisplay = document.getElementById('quoteDisplay');
        const generateBtn = document.getElementById('generateBtn');

        generateBtn.addEventListener('click', () => {
            // Generate a random index based on array length
            const randomIndex = Math.floor(Math.random() * quotes.length);
            
            // Display the random quote
            quoteDisplay.textContent = quotes[randomIndex];
        });
    </script>

</body>
</html>
