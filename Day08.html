<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8 - JS Counter App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .counter-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 280px;
        }

        #count {
            font-size: 48px;
            margin: 20px 0;
            color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add { background-color: #22c55e; color: white; }
        .btn-sub { background-color: #ef4444; color: white; }
        .btn-reset { background-color: #64748b; color: white; }

        button:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="counter-card">
        <h2>Day 8: Counter App</h2>
        <div id="count">0</div>

        <div class="btn-group">
            <button class="btn-sub" id="btnDecrease">-</button>
            <button class="btn-reset" id="btnReset">Reset</button>
            <button class="btn-add" id="btnIncrease">+</button>
        </div>
    </div>

    <script>
        // JavaScript Logic
        let countValue = 0;

        const countDisplay = document.getElementById('count');
        const btnIncrease = document.getElementById('btnIncrease');
        const btnDecrease = document.getElementById('btnDecrease');
        const btnReset = document.getElementById('btnReset');

        btnIncrease.addEventListener('click', () => {
            countValue++;
            countDisplay.textContent = countValue;
        });

        btnDecrease.addEventListener('click', () => {
            countValue--;
            countDisplay.textContent = countValue;
        });

        btnReset.addEventListener('click', () => {
            countValue = 0;
            countDisplay.textContent = countValue;
        });
    </script>

</body>
</html>
