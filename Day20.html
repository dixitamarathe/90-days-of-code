
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 20 - Notes App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px #00000015;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline-color: #6366f1;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        #saveNoteBtn {
            background: #4f46e5;
            color: white;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        #noteDisplay {
            list-style: none;
        }

        .note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #f3f4f6;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .note-text {
            flex: 1;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            flex-shrink: 0;
        }

        #emptyMessage {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 420px) {
            .container {
                padding: 20px 15px;
            }

            .input-group {
                flex-direction: column;
            }

            #saveNoteBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📝 My Notes</h1>
        <p class="subtitle">Day 20 | Logic Revision Mini-App</p>

        <div class="input-group">
            <input
                type="text"
                id="noteInput"
                placeholder="Write your note here..."
                maxlength="500"
            >
            <button id="saveNoteBtn">+ Add Note</button>
        </div>

        <h2>My Saved Notes</h2>

        <ul id="noteDisplay"></ul>

        <p id="emptyMessage">No notes yet. Add your first note! ✨</p>

        <p class="footer">
            Built with HTML, CSS, JavaScript & LocalStorage 💜
        </p>
    </div>

    <script>
        // 1. Select HTML elements
        const noteInput = document.getElementById("noteInput");
        const saveNoteBtn = document.getElementById("saveNoteBtn");
        const noteDisplay = document.getElementById("noteDisplay");
        const emptyMessage = document.getElementById("emptyMessage");

        // 2. Load saved notes from LocalStorage
        let notes = JSON.parse(localStorage.getItem("day20Notes")) || [];

        // 3. Display notes on the screen
        function displayNotes() {
            noteDisplay.innerHTML = "";

            notes.forEach(function(note, index) {
                const li = document.createElement("li");
                li.className = "note";

                const span = document.createElement("span");
                span.className = "note-text";
                span.textContent = note;

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "Delete";

                deleteBtn.addEventListener("click", function() {
                    notes.splice(index, 1);
                    saveNotes();
                    displayNotes();
                });

                li.appendChild(span);
                li.appendChild(deleteBtn);
                noteDisplay.appendChild(li);
            });

            emptyMessage.style.display =
                notes.length === 0 ? "block" : "none";
        }

        // 4. Save notes to LocalStorage
        function saveNotes() {
            localStorage.setItem("day20Notes", JSON.stringify(notes));
        }

        // 5. Add a new note
        function addNote() {
            const noteText = noteInput.value.trim();

            if (noteText === "") {
                alert("Please write a note first!");
                return;
            }

            notes.push(noteText);
            saveNotes();
            displayNotes();

            noteInput.value = "";
            noteInput.focus();
        }

        // 6. Handle button click
        saveNoteBtn.addEventListener("click", addNote);

        // 7. Allow Enter key to add a note
        noteInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                addNote();
            }
        });

        // 8. Display previously saved notes on page load
        displayNotes();
    </script>
</body>
</html>
