<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19 - Timed Action</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 320px;
            text-align: center;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
        }

        button {
            padding: 10px 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Day 19: Async Action</h2>
        <p>Click the button to start a timed process.</p>
        <button id="startBtn">Start Timer</button>
        <div id="status"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        startBtn.addEventListener('click', () => {
            statusDiv.textContent = "Processing... Please wait (2s)";
            statusDiv.style.color = "#fbbf24";

            // setTimeout simulates a delayed operation (2000 ms = 2 seconds)
            setTimeout(() => {
                statusDiv.textContent = "Action Completed Successfully!";
                statusDiv.style.color = "#22c55e";
            }, 2000);
        });
    </script>

</body>
</html>
