<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Day 3 - CSS Basics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Day 3: Adding CSS Styles</h1>
        <p>Today I learned how to style an HTML page using Internal CSS!</p>
    </div>
</body>
</html>
