<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 14 - Persistent Task List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .todo-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 340px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #38bdf8;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
        }

        button.add-btn {
            padding: 8px 14px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        ul {
            padding-left: 0;
            list-style: none;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #334155;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            color: #cbd5e1;
        }

        button.delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button.delete-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <h2>Day 14: LocalStorage Todo</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a persistent task...">
            <button class="add-btn" id="addBtn">Add</button>
        </div>

        <ul id="taskList">
            <!-- Dynamic tasks stored in localStorage -->
        </ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // Load tasks from localStorage on page load (or empty array)
        let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

        function renderTasks() {
            taskList.innerHTML = "";
            
            tasks.forEach((taskText, index) => {
                const li = document.createElement('li');
                li.textContent = taskText;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete-btn";

                deleteBtn.addEventListener('click', () => {
                    tasks.splice(index, 1); // Remove from array
                    localStorage.setItem('myTasks', JSON.stringify(tasks)); // Update storage
                    renderTasks(); // Re-render UI
                });

                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
        }

        // Initial render
        renderTasks();

        addBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();

            if (taskText !== "") {
                tasks.push(taskText);
                localStorage.setItem('myTasks', JSON.stringify(tasks)); // Save to storage
                renderTasks();
                taskInput.value = "";
            }
        });
    </script>

</body>
</html>
