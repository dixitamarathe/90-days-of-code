
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 17 | Sum Calculator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at top left, #312e81, transparent 45%),
        linear-gradient(135deg, #0f172a, #111827);
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      border-radius: 24px;
      box-shadow: 0 25px 60px #00000050;
    }

    .tag {
      display: inline-block;
      padding: 7px 12px;
      margin-bottom: 18px;
      border-radius: 30px;
      color: #ddd6fe;
      background: #4c1d95;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px #8b5cf633;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px #7c3aed55;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      text-align: center;
      border-radius: 16px;
      background: #0f172a;
      border: 1px solid #334155;
    }

    .result p {
      color: #94a3b8;
      font-size: 13px;
    }

    #answer {
      display: block;
      margin-top: 8px;
      color: #c4b5fd;
      font-size: 36px;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 20px;
      margin-top: 12px;
      color: #fca5a5;
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      color: #64748b;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <span class="tag">DAY 17 • JAVASCRIPT</span>

    <h1>Sum Calculator ✨</h1>

    <p class="description">
      Explore functions, parameters and return values
      with this interactive calculator.
    </p>

    <form id="sumForm">
      <label for="num1">First Number</label>
      <input
        type="number"
        id="num1"
        step="any"
        placeholder="Enter first number"
        required
      />

      <label for="num2">Second Number</label>
      <input
        type="number"
        id="num2"
        step="any"
        placeholder="Enter second number"
        required
      />

      <button type="submit">Calculate Sum →</button>
    </form>

    <section class="result" aria-live="polite">
      <p>YOUR RESULT</p>
      <strong id="answer">0</strong>
      <p id="message">Enter two numbers to get started.</p>
    </section>

    <div class="footer">
      75-Day Coding Challenge · Day 17
    </div>
  </main>

  <script>
    // Function: accepts two parameters and returns their sum.
    function addNumbers(a, b) {
      return a + b;
    }

    const form = document.getElementById("sumForm");
    const answer = document.getElementById("answer");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const firstValue = document.getElementById("num1").value;
      const secondValue = document.getElementById("num2").value;

      if (firstValue.trim() === "" || secondValue.trim() === "") {
        message.textContent = "Please enter both numbers.";
        return;
      }

      const num1 = Number(firstValue);
      const num2 = Number(secondValue);

      if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
        message.textContent = "Please enter valid finite numbers.";
        return;
      }

      const sum = addNumbers(num1, num2);

      answer.textContent = String(sum);
      message.textContent = `${num1} + ${num2} = ${sum}`;

      console.log("First Number:", num1);
      console.log("Second Number:", num2);
      console.log("Returned Sum:", sum);
    });
  </script>
</body>
</html>
